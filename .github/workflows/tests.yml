name: Tests
on:
  workflow_dispatch:
    inputs:
      marker:
        description: Pytest marker (all = no filter)
        required: true
        default: all
        type: choice
        options: [all, sanity, be, fe, events, admin, orders, live_api, component]

concurrency:
  group: live-arena-tests
  cancel-in-progress: true

jobs:
  test:
    name: ${{ inputs.marker }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Jerusalem
      FAN_EMAIL: ${{ secrets.FAN_EMAIL }}
      FAN_PASSWORD: ${{ secrets.FAN_PASSWORD }}
      FAN_API_KEY: ${{ secrets.FAN_API_KEY }}
      ORGANIZATION_API_KEY: ${{ secrets.ORGANIZATION_API_KEY }}
      PYTEST_MARK: ${{ inputs.marker != 'all' && format('-m {0}', inputs.marker) || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Test
        run: pytest tests $PYTEST_MARK -v --tb=short --color=yes
